[build]
command = "npm run build"
publish = "dist"

# Server-side booking proxy. The RESOS_API_KEY / STRIPE_* secrets live only in
# Netlify env vars and are used inside these functions — never in the client bundle.
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

# --- SEO / indexation ---------------------------------------------------------
# Canonical host is NON-WWW. Belt-and-suspenders 301 in case the Netlify
# "Primary domain" setting is ever changed; both layers point www → non-www.
[[redirects]]
from = "https://www.dogmawinebar.com/*"
to = "https://dogmawinebar.com/:splat"
status = 301
force = true

# Legacy pre-Astro shop (/shop/<id>) is gone on purpose → 410 Gone, so Google
# de-indexes cleanly instead of retrying ~31 soft-404s. NOT a mass 301 to
# /signature-cases: an individual old product is not that page's equivalent.
# Kept in netlify.toml (not _redirects) and placed before the catch-all 404
# below, because netlify.toml rules are evaluated first — otherwise /* → 404
# would shadow these and return 404 instead of 410.
[[redirects]]
from = "/shop/*"
to = "/410.html"
status = 410
force = true

[[redirects]]
from = "/shop"
to = "/410.html"
status = 410
force = true

# Pretty paths for the booking API → the underlying functions.
[[redirects]]
from = "/api/check-availability"
to = "/.netlify/functions/check-availability"
status = 200
force = true

[[redirects]]
from = "/api/create-checkout-session"
to = "/.netlify/functions/create-checkout-session"
status = 200
force = true

[[redirects]]
from = "/api/create-case-checkout"
to = "/.netlify/functions/create-case-checkout"
status = 200
force = true

# Serve the custom 404 page with a proper 404 status for any unmatched URL.
[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[context.production.environment]
NODE_VERSION = "24.16.0"
